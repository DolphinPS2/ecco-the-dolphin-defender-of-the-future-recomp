name: Build Launcher and Tools

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows-pack:
    runs-on: windows-latest
    steps:
      - name: Checkout port
        uses: actions/checkout@v4
        with:
          path: port

      - name: Checkout dreamcomp
        uses: actions/checkout@v4
        with:
          repository: cherryduck/dreamcomp
          ref: linux-ecco
          submodules: recursive
          path: dreamcomp

      - name: Verify Python scripts and Audit
        shell: cmd
        run: |
          set PYTHONUTF8=1
          python -m py_compile port\windows\launcher.py port\tools\extract_paradox_mod.py
          python dreamcomp\tools\audit.py --repo port assets

      - name: Build Native Stub and chdr.dll
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSDIR=%%i
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S dreamcomp\engine\third_party\libchdr -B chdr-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          cmake --build chdr-build
          cl /O2 /EHsc port\windows\ecco_stub.cpp /Fe:Ecco_the_Dolphin.exe /link user32.lib shell32.lib /SUBSYSTEM:WINDOWS

      - name: Package Windows Starter Kit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-win | Out-Null
          Copy-Item Ecco_the_Dolphin.exe, chdr-build\chdr.dll, port\windows\launcher.py, port\windows\build_windows.bat, port\windows\build_windows.ps1 dist-win\

      - name: Upload Windows Starter Kit
        uses: actions/upload-artifact@v4
        with:
          name: Ecco-Windows-Launcher-Kit
          path: dist-win/

  verify-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout port
        uses: actions/checkout@v4

      - name: Verify Linux scripts
        run: |
          bash -n linux/build_linux.sh
          python3 -m py_compile windows/launcher.py tools/extract_paradox_mod.py
