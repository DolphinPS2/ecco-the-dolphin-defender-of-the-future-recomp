desc_r-about=ПК-порт <b>Ecco the Dolphin: Defender of the Future</b> (Dreamcast) на базе статической рекомпиляции <b>dreamcomp</b>: код SH-4 переведён в нативный C++, графика и звук эмулируются dream-recomp.<br/><br/><b>Требуется образ диска:</b> игровые ресурсы не включены в сборку.<br/><b>Авторы:</b> dreamcomp — Daniel Gomes Vieira; dream-recomp — phobos665 (Flycast — flyinghead). GNU GPL v2.0.<br/><b>Интерфейс и шрифты:</b> RmlUi, FreeType, SDL3, Inter, PromptFont.<br/><br/><b>Сборка и перевод для ПК:</b> Dolphin_PS2.
