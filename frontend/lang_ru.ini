desc_rumble=Сила вибрации геймпада при событиях в игре. Значение 0 % полностью отключает вибрацию.
desc_fps=<b>Авто</b>: плавная интерполяция кадров на экранах 120 Гц и выше.<br/><b>120</b>: всегда сглаживать до 120 FPS.<br/><b>60</b>: только родные кадры игры.<br/><br/>Сама игровая логика всегда работает на 60 FPS.
desc_frame_timing=<b>По частоте экрана</b>: подстраивает темп под частоту монитора (на 60 Гц быстрее всего на 0.1 %, что незаметно для глаза и слуха, зато каждый кадр обновляется ровно).<br/><br/><b>Точно 59.94 Гц</b>: строгий тайминг консоли Dreamcast.
desc_scale=Внутреннее разрешение 3D-сцены кратно родному 640×480. Более высокие значения делают картинку чётче, но требуют более мощную видеокарту.
desc_aspect=<b>Оригинал</b>: классический кадр 4:3 с чёрными полосами по бокам.<br/><br/><b>Широкоформатный</b>: честно расширяет угол обзора под форму окна (вплоть до 21:9) без растягивания интерфейса и моделей.
desc_fullscreen=Полноэкранный режим без рамок на текущем мониторе. Переключение в любой момент: Alt+Enter.
desc_latency=<b>Стандартная</b>: держит небольшой буфер кадров для максимальной плавности.<br/><br/><b>Низкая</b>: выводит кадр на экран максимально быстро (на ~13 мс быстрее), требует стабильной производительности.
desc_hud_layout=Расположение элементов интерфейса в широкоформатном режиме.<br/><br/><b>Оригинал</b>: удерживает индикаторы в центральной зоне 4:3.<br/><br/><b>Широкоформатный</b>: прижимает шкалу здоровья и воздуха к краям экрана.
desc_volume=Общая громкость всех звуков и музыки в игре.
desc_clip=<b>Оригинал</b>: оригинальный громкий микс Dreamcast.<br/><br/><b>Мягкий</b>: плавно сглаживает пики громких звуков, убирая перегрузку и хрип.
desc_texture_pack=Заменяет оригинальные текстуры игры на HD-текстуры (PNG) из папки текстур.
desc_open_textures=Открывает папку текстур (создаётся автоматически). Поместите туда файлы текстур-пака.
desc_dump_textures=Для авторов текстур-паков: сохраняет все используемые игрой текстуры в папку texture_dump.
desc_mods=Каждая папка внутри mods заменяет соответствующие файлы диска. Включённые моды загружаются сверху вниз; приоритет у верхнего.
desc_open_mods=Открывает папку mods (создаётся автоматически). Добавляйте каждый мод отдельной папкой.
desc_about=Нативный ПК-порт игры Ecco the Dolphin: Defender of the Future (SEGA Dreamcast), собранный на базе статической рекомпиляции dreamcomp.<br/><br/>Поддерживает европейскую версию (Europe Original) и русскую версию с полной озвучкой (Paradox RUS).
